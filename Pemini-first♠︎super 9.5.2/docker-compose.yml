version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pemini
      POSTGRES_PASSWORD: pemini123
      POSTGRES_DB: pemini_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://pemini:pemini123@db:5432/pemini_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
