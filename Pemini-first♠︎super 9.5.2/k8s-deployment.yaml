apiVersion: v1
kind: Namespace
metadata:
  name: pemini

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pemini-app
  namespace: pemini
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pemini-app
  template:
    metadata:
      labels:
        app: pemini-app
    spec:
      containers:
      - name: pemini-app
        image: pemini-girl:9.5.2
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://pemini:pemini123@postgres:5432/pemini_db"

---
apiVersion: v1
kind: Service
metadata:
  name: pemini-service
  namespace: pemini
spec:
  selector:
    app: pemini-app
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer
